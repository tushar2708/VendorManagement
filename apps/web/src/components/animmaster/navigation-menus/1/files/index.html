<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Nav Menu</title>

   <!-- Connected Styles -->
   <link rel="stylesheet" href="style.css" />

   <!-- Google Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>

<body>
   <!-- ===== HTML ===== -->

   <!-- Demo page content behind the menu -->
   <main class="page">
      <h1 class="page__title">Animmaster</h1>
   </main>

   <!-- ===== HEADER BLOCK =====
        Fixed top bar containing:
        - logo on the left
        - menu toggle (burger + "Menu/Close" label) in the center
        - shop + cart on the right (hidden when the menu is open) -->
   <header class="header">
      <div class="header__bar">

         <!-- Logo -->
         <a href="#" class="header__logo">Shopy.co</a>

         <!-- Toggle button (burger + Menu/Close label) -->
         <div class="header__toggle" id="js-toggle">
            <div class="header__burger" id="js-burger"></div>
            <div class="header__label">
               <!-- Both labels sit in the same spot; GSAP cross-fades them -->
               <p class="header__label-text header__label-text--menu"  id="js-label-menu">Menu</p>
               <p class="header__label-text header__label-text--close" id="js-label-close">Close</p>
            </div>
         </div>

         <!-- Shop + Cart (fades out while the menu is open) -->
         <div class="header__shop" id="js-shop">
            <p class="header__shop-label">Shop</p>
            <div class="header__cart">
               <!-- Cart icon -->
               <svg width="19" height="20" viewBox="0 0 19 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1.66602 1.66667H2.75449C2.9595 1.66667 3.06201 1.66667 3.1445 1.70437C3.2172 1.73759 3.2788 1.79102 3.32197 1.85829C3.37096 1.93462 3.38546 2.0361 3.41445 2.23905L3.80887 5M3.80887 5L4.68545 11.4428C4.79669 12.2604 4.85231 12.6692 5.04777 12.977C5.22 13.2481 5.46692 13.4637 5.75881 13.5978C6.09007 13.75 6.50264 13.75 7.32777 13.75H14.4593C15.2448 13.75 15.6375 13.75 15.9585 13.6087C16.2415 13.4841 16.4842 13.2832 16.6596 13.0285C16.8585 12.7397 16.9319 12.3539 17.0789 11.5823L18.1819 5.79141C18.2337 5.51984 18.2595 5.38405 18.222 5.27792C18.1892 5.18481 18.1243 5.1064 18.039 5.05668C17.9417 5 17.8035 5 17.527 5H3.80887ZM8.33268 17.5C8.33268 17.9602 7.95959 18.3333 7.49935 18.3333C7.03911 18.3333 6.66602 17.9602 6.66602 17.5C6.66602 17.0398 7.03911 16.6667 7.49935 16.6667C7.95959 16.6667 8.33268 17.0398 8.33268 17.5ZM14.9993 17.5C14.9993 17.9602 14.6263 18.3333 14.166 18.3333C13.7058 18.3333 13.3327 17.9602 13.3327 17.5C13.3327 17.0398 13.7058 16.6667 14.166 16.6667C14.6263 16.6667 14.9993 17.0398 14.9993 17.5Z"
                     stroke="#4D3D30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
               </svg>
               <p>Cart(0)</p>
            </div>
         </div>
      </div>

      <!-- ===== NAV BLOCK =====
           The drop-down panel. Its height animates 0 → auto to
           reveal the links, footer and preview image. -->
      <div class="nav" id="js-nav">
         <div class="nav__wrapper">

            <!-- Left column: links + footer -->
            <div class="nav__container">

               <!-- ELEMENT: nav__body (the big links list) -->
               <div class="nav__body" id="js-nav-body">
                  <!-- Each link has data-index + data-src — used by JS to:
                       1. swap the preview image on hover
                       2. blur every OTHER link when one is hovered -->
                  <a href="#" class="nav__link" data-index="0" data-src="home.png">Home</a>
                  <a href="#" class="nav__link" data-index="1" data-src="shop.png">Shop</a>
                  <a href="#" class="nav__link" data-index="2" data-src="about_us.png">About Us</a>
                  <a href="#" class="nav__link" data-index="3" data-src="lookbook.png">Lookbook</a>
                  <a href="#" class="nav__link" data-index="4" data-src="contact.png">Contact</a>
               </div>

               <!-- ELEMENT: nav__footer (small credit lines) -->
               <div class="nav__footer">
                  <ul><li><span>Made by:</span> Animmaster</li></ul>
                  <ul><li><span>Typography:</span> Google Fonts</li></ul>
                  <ul><li><span>Images:</span> Freepik, Envato</li></ul>
                  <ul>
                     <li>Privacy Policy</li>
                     <li>Terms &amp; Conditions</li>
                  </ul>
               </div>
            </div>

            <!-- Right column: preview image that swaps on hover.
                 Starts invisible; fades in when any link is hovered. -->
            <div class="nav__image" id="js-nav-image">
               <img src="img/home.png" alt="preview" id="js-nav-image-el" />
            </div>
         </div>
      </div>

      <!-- Dark overlay that appears under the menu while it's open.
           Its height animates from 0 to 100vh to cover the page below. -->
      <div class="header__background" id="js-background"></div>

   </header>

   <!-- ======================= -->

   <!-- Connected libs -->
   <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

   <!-- Connected script -->
   <script src="script.js"></script>
</body>

</html>
