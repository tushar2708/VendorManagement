<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="92" y1="80" x2="148" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="60" y1="60" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="vGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="discGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="shadow"/>
      <feFlood flood-color="#818cf8" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="shadow" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="40" fill="url(#bg)"/>

  <!-- Outer gear ring -->
  <circle cx="120" cy="120" r="64" stroke="url(#gearGrad)" stroke-width="3" fill="none"/>

  <!-- Gear teeth — bright silver -->
  <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="48" x2="120" y2="32"/>
    <line x1="120" y1="192" x2="120" y2="208"/>
    <line x1="48" y1="120" x2="32" y2="120"/>
    <line x1="192" y1="120" x2="208" y2="120"/>
    <line x1="68" y1="68" x2="56" y2="56"/>
    <line x1="172" y1="68" x2="184" y2="56"/>
    <line x1="68" y1="172" x2="56" y2="184"/>
    <line x1="172" y1="172" x2="184" y2="184"/>
  </g>

  <!-- Inner ring -->
  <circle cx="120" cy="120" r="48" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Glowing accent disc -->
  <circle cx="120" cy="120" r="36" fill="#6366f1" opacity="0.18" filter="url(#discGlow)"/>

  <!-- V letterform — bright white-indigo with glow -->
  <path d="M90 82 L120 164 L150 82" stroke="url(#vGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#vGlow)"/>

  <!-- M letterform — light -->
  <path d="M92 172 L106 156 L120 172 L134 156 L148 172" stroke="#c7d2fe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
</svg>
